<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>redoubt</title>
    <style>
      :root {
        --bg: #0b0e12;
        --panel: rgba(16, 21, 27, 0.86);
        --line: #232c36;
        --text: #c9d4e0;
        --dim: #6b7785;
        --blue: #4da3ff;
        --red: #ff6b57;
        --warn: #ffb454;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        overflow: hidden;
      }

      #stage { position: relative; width: 100vw; height: 100vh; }
      canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

      .panel {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 10px;
        line-height: 1.5;
        pointer-events: none;
        white-space: pre;
      }

      #scoreboard { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
      #status     { bottom: 12px; left: 12px; }
      #weapon     { bottom: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
      /* Sits just under the crosshair, where the eye already is. */
      #prompt     { top: 54%; left: 50%; transform: translateX(-50%); display: none; text-align: center; }
      #netgraph   { top: 12px; right: 12px; color: var(--dim); }
      #movement   { top: 130px; right: 12px; color: var(--dim); }
      #supply     { bottom: 12px; left: 240px; display: none; }
      #feed       { bottom: 12px; right: 12px; text-align: right; color: var(--dim); }
      #help       { top: 50%; left: 12px; transform: translateY(-50%); color: var(--dim); }

      /* Centre dot. Deliberately minimal: the spread cone is what decides a
         hit, and a big reticle would imply a precision the weapon lacks. */
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        display: none;
        pointer-events: none;
      }
      #crosshair.shown { display: block; }

      /* Suppression: being shot at narrows the world. Opacity is driven from
         the authoritative suppression value, not from a local guess. */
      #suppression {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms linear;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 35%,
          rgba(12, 8, 6, 0.85) 100%
        );
      }

      #deploy {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(11, 14, 18, 0.82);
      }
      #deploy.shown { display: flex; }
      #deploy .box {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 6px;
        padding: 20px 26px;
        min-width: 320px;
      }
      #deploy h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
      #deploy .sub { color: var(--dim); margin-bottom: 14px; }
      #deploy button {
        display: block;
        white-space: pre-line;
        width: 100%;
        margin: 6px 0;
        padding: 9px 12px;
        font: inherit;
        text-align: left;
        color: var(--text);
        background: #161c24;
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
      }
      #deploy button:hover:not(:disabled) { border-color: var(--blue); }
      #deploy button:disabled { color: var(--dim); cursor: not-allowed; }

      #join {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 10;
      }
      #join.hidden { display: none; }
      #join .box { text-align: center; }
      #join h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: 0.14em; }
      #join p { color: var(--dim); margin: 0 0 18px; }
      #join input, #join button {
        font: inherit;
        color: var(--text);
        background: #161c24;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 12px;
      }
      #join button { cursor: pointer; margin-left: 6px; }
      #join button:hover { border-color: var(--blue); }
      .blue { color: var(--blue); }
      .red  { color: var(--red); }
      .warn { color: var(--warn); }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view3d"></canvas>
      <canvas id="view"></canvas>
      <div id="crosshair"></div>
      <div id="suppression"></div>

      <div id="scoreboard" class="panel"></div>
      <div id="status" class="panel"></div>
      <div id="weapon" class="panel"></div>
      <div id="prompt" class="panel"></div>
      <div id="supply" class="panel"></div>
      <div id="netgraph" class="panel"></div>
      <div id="movement" class="panel"></div>
      <div id="feed" class="panel"></div>
      <div id="help" class="panel"></div>

      <div id="deploy">
        <div class="box">
          <h2>Deploy</h2>
          <div class="sub" id="deploy-sub"></div>
          <div id="deploy-options"></div>
        </div>
      </div>

      <div id="join">
        <div class="box">
          <h1>REDOUBT</h1>
          <p>tactical team shooter &mdash; 2D playable build</p>
          <input id="join-name" type="text" placeholder="callsign" maxlength="24" />
          <button id="join-go">deploy</button>
          <p id="join-status" style="margin-top: 14px"></p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
